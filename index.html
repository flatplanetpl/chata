<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chata — mieszkania</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#162033;--muted:#6b778d;--line:#dce4ef;--blue:#155eef;--green:#157347;--amber:#9a6200;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eaf1ff,#f6f8fb 260px,#f4f7fb);color:var(--ink)}
.shell{max-width:1420px;margin:auto;padding:24px 20px 60px}.hero{background:linear-gradient(135deg,#10295f,#155eef 58%,#3b82f6);color:#fff;padding:28px;border-radius:24px;box-shadow:0 18px 44px rgba(21,94,239,.2)}
h1{font-size:clamp(30px,4vw,46px);margin:0 0 8px;letter-spacing:-.04em}.hero p{margin:0;color:#dce8ff;line-height:1.55}.source{margin-top:16px;display:inline-block;background:#ffffff1f;border:1px solid #ffffff40;padding:7px 10px;border-radius:999px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:#fffffff2;border:1px solid var(--line);border-radius:15px;padding:15px 17px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:700}.stat b{font-size:24px}
.filters{position:sticky;top:8px;z-index:5;background:#fffffff2;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 32px rgba(25,45,80,.09)}
.grid{display:grid;grid-template-columns:minmax(250px,2fr) repeat(4,minmax(130px,1fr));gap:9px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin:0 0 5px 3px}.ctl{width:100%;height:41px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font:inherit}
.cards{align-items:start;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 5px 18px rgba(25,45,80,.05);display:flex;flex-direction:column}.card.off{opacity:.6}.card.since-visit{border-color:#acd5c6;box-shadow:0 0 0 1px #acd5c62b,0 5px 18px rgba(25,45,80,.05)}.card.since-visit .top{background:#f0f8f4}.card.since-visit .badge.new{background:#e0f0e8;color:#256548}
.top{padding:16px 17px 12px;border-bottom:1px solid #edf1f6}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.badge{font-size:10.5px;font-weight:850;border-radius:999px;padding:5px 8px;background:#eef2f7;color:#566277}.good{background:#e7f6ee;color:var(--green)}.warn{background:#fff3d5;color:var(--amber)}.bad{background:#feeceb;color:var(--red)}
.title{display:flex;justify-content:space-between;gap:12px}.title>div:first-child{min-width:0}.loc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-size:18px;font-weight:850}.date{font-size:11px;color:var(--muted);margin-top:4px}.rent{text-align:right;white-space:nowrap}.rent b{font-size:23px;color:#114fc9}.rent small{display:block;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 17px 0}.metric{background:#f8fafc;border:1px solid #e8edf4;border-radius:10px;padding:9px}.metric b{display:block}.metric span{font-size:10px;color:var(--muted)}
.body{padding:12px 17px;display:flex;flex-direction:column;gap:9px;flex:1}.body p{margin:0;color:#45536a;font-size:13px;line-height:1.5}.extra{font-size:12px;background:#f7f9fc;border-radius:9px;padding:9px}.row{display:flex;justify-content:space-between;border-top:1px dashed #e1e7ef;padding-top:9px;font-size:12px}.row span:first-child{color:var(--muted);font-weight:700}.foot{padding:12px 17px 15px;border-top:1px solid #edf1f6}.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:10px 12px;font-weight:800;background:var(--blue);color:white}
.edit{margin:0 17px 15px;border:1px solid #e4e9f1;border-radius:10px;background:#fafbfd}.edit summary{padding:9px 11px;cursor:pointer;font-size:12px;font-weight:800;color:#58647a}.editin{padding:0 11px 11px;display:grid;grid-template-columns:140px 1fr;gap:8px}.edit textarea{min-height:66px;resize:vertical;padding:8px;height:auto}
.photo-open{display:block;position:relative;width:100%;height:190px;border:0;padding:0;background:#e8edf5;cursor:pointer;overflow:hidden}.photo-open img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}.photo-open:hover img{transform:scale(1.04)}.photo-open span{position:absolute;right:10px;bottom:10px;padding:7px 10px;border-radius:8px;background:#162033df;color:#fff;font-size:12px;font-weight:800}.photo-empty{height:100px;display:grid;place-items:center;background:#eef2f7;color:var(--muted);font-size:12px;font-weight:700}
.photo-dialog{width:min(1000px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;border:0;border-radius:16px;background:#101827;color:white;box-shadow:0 24px 80px #0008}.photo-dialog::backdrop{background:#071225d9}.photo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}.photo-bar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.photo-close,.photo-nav{border:1px solid #ffffff55;border-radius:8px;background:#ffffff24;color:white;cursor:pointer;font:inherit;font-weight:800}.photo-close{padding:6px 10px}.photo-stage{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}.photo-stage img{display:block;max-width:calc(100% - 110px);max-height:calc(100vh - 150px);object-fit:contain}.photo-nav{padding:12px}.photo-caption{text-align:center;margin:8px 0 14px;color:#dce8ff;font-size:13px}
.description-preview{overflow-wrap:anywhere}.listing-details summary{cursor:pointer;color:var(--blue);font-size:13px;font-weight:700;padding:8px 0}.listing-details summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.listing-details .less{display:none}.listing-details[open] .less{display:inline}.listing-details[open] .more{display:none}.body:has(.listing-details[open])>.description-preview{display:none}.listing-details p{margin:8px 0;overflow-wrap:anywhere}.listing-details .detail-note{font-size:12px;color:var(--muted)}
.empty{display:none;background:white;border:1px dashed #bbc6d7;border-radius:16px;padding:45px;text-align:center;color:var(--muted);margin-top:16px}
@media(max-width:1100px){.grid{grid-template-columns:2fr repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.shell{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}.grid .search{grid-column:1/-1}.cards{grid-template-columns:1fr}.editin{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell">
<section class="hero"><h1>Chata</h1><p>3-pokojowe mieszkania do wynajęcia — Ołtaszyn i okolice.</p><div id="source" class="source">Ładowanie ofert…</div></section>
<section class="stats"><div class="stat"><span>Widoczne</span><b id="sCount">—</b></div><div class="stat"><span>Aktywne</span><b id="sActive">—</b></div><div class="stat"><span>Kot: TAK</span><b id="sPet">—</b></div><div class="stat"><span>Mediana najmu</span><b id="sMedian">—</b></div></section>
<section class="filters"><div class="grid">
<div class="field search"><label>Szukaj</label><input id="q" class="ctl" placeholder="Klecina, taras, garaż, klimatyzacja…"></div>
<div class="field"><label>Kot</label><select id="pet" class="ctl"><option value="allowed">TAK / do uzgodnienia / brak info</option><option value="yes">Tylko TAK</option><option value="all">Wszystkie</option></select></div>
<div class="field"><label>Status</label><select id="status" class="ctl"><option value="all">Wszystkie</option><option>Ciekawe</option><option>Do sprawdzenia</option><option>Obejrzane</option><option>Odrzucone</option><option>Nieaktualne</option></select></div>
<div class="field"><label>Maks. najem</label><input id="maxRent" type="number" value="3700" class="ctl"></div>
<div class="field"><label>Sortowanie</label><select id="sort" class="ctl"><option value="found">Najnowsze znalezione</option><option value="listing">Najnowsze ogłoszenia</option><option value="rent">Najem: najtaniej</option><option value="total">Koszt razem: najtaniej</option><option value="area">Metraż: największy</option></select></div>
</div></section>
<p id="visitError" role="status" style="color:var(--amber)"></p>
<p id="saveError" role="alert" style="color:var(--red)"></p>
<main id="cards" class="cards"></main><div id="empty" class="empty">Brak ofert pasujących do filtrów.</div>
</div>
<dialog id="photoDialog" class="photo-dialog" aria-label="Zdjęcia mieszkania"><div class="photo-bar"><b id="photoTitle"></b><button id="photoClose" class="photo-close" type="button" aria-label="Zamknij zdjęcia">✕</button></div><div class="photo-stage"><button id="photoPrev" class="photo-nav" type="button" aria-label="Poprzednie zdjęcie">‹</button><img id="photoImage" alt=""><button id="photoNext" class="photo-nav" type="button" aria-label="Następne zdjęcie">›</button></div><p id="photoCaption" class="photo-caption"></p></dialog>
<script>
const H={found:'found',listing:'listing_date',status:'status',activity:'activity',loc:'location',portal:'portal',rent:'rent',fees:'fees',total:'total',area:'area',pet:'pets',extras:'extras',desc:'description',notes:'notes',link:'url'};
let rows=[],filtered=[],galleries={},currentPhotos=[],currentPhoto=0;
let newListingIds=new Set();const $=id=>document.getElementById(id);
const num=v=>{if(v===null||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const money=v=>num(v)==null?'—':new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(num(v))+' zł';
const area=v=>num(v)==null?'—':new Intl.NumberFormat('pl-PL',{maximumFractionDigits:1}).format(num(v))+' m²';
const date=v=>v?String(v).slice(0,10):'—';
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const key=r=>r[H.link];
function statusClass(v){if(v==='Ciekawe')return'good';if(v==='Odrzucone'||v==='Nieaktualne')return'bad';if(v==='Do sprawdzenia')return'warn';return''}
function petClass(v){if(v==='Tak')return'good';if(v==='Nie')return'bad';if(v==='Do uzgodnienia')return'warn';return''}
async function save(row, changes, control){
  const controls=control.closest('.editin').querySelectorAll('select,textarea');
  controls.forEach(input=>input.disabled=true);
  $('saveError').textContent='';
  try{
    const response=await fetch('/api/listings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:row.url,...changes})});
    if(!response.ok)throw Error('Serwer odrzucił zapis ('+response.status+')');
    Object.assign(row,changes);
    if('status' in changes)filter();
  }catch(error){
    if('status' in changes)control.value=row.status;
    $('saveError').textContent='Nie zapisano zmian: '+error.message+'. Spróbuj ponownie.';
  }finally{
    controls.forEach(input=>input.disabled=false);
  }
}
function photoCard(r){const photos=galleries[r[H.link]];if(photos===undefined||photos.length===0)return'<div class="photo-empty">Zdjęcia niedostępne</div>';return'<button class="photo-open" type="button" data-gallery="'+esc(r[H.link])+'" aria-label="Zobacz '+photos.length+' zdjęć: '+esc(r[H.loc])+'"><img loading="lazy" src="'+esc(photos[0])+'" alt="'+esc(r[H.loc])+'"><span>Zobacz '+photos.length+' zdjęć</span></button>'}
function showPhoto(){const image=$('photoImage');image.src=currentPhotos[currentPhoto];image.alt=$('photoTitle').textContent+' — zdjęcie '+(currentPhoto+1);$('photoCaption').textContent=(currentPhoto+1)+' / '+currentPhotos.length}
function movePhoto(step){currentPhoto=(currentPhoto+step+currentPhotos.length)%currentPhotos.length;showPhoto()}
function openGallery(link){currentPhotos=galleries[link];currentPhoto=0;const listing=rows.find(row=>row[H.link]===link);$('photoTitle').textContent=listing[H.loc];showPhoto();$('photoDialog').showModal()}
function closeGallery(){$('photoDialog').close();$('photoImage').removeAttribute('src')}
$('cards').addEventListener('click',event=>{const button=event.target.closest('.photo-open');if(button)openGallery(button.dataset.gallery)});
$('photoPrev').onclick=()=>movePhoto(-1);$('photoNext').onclick=()=>movePhoto(1);$('photoClose').onclick=closeGallery;
$('photoDialog').addEventListener('click',event=>{if(event.target===$('photoDialog'))closeGallery()});
document.addEventListener('keydown',event=>{if(!$('photoDialog').open)return;if(event.key==='ArrowLeft')movePhoto(-1);if(event.key==='ArrowRight')movePhoto(1)});
$('photoImage').onerror=()=>$('photoCaption').textContent='Nie udało się wczytać tego zdjęcia';
function compareNullable(a,b,descending=false){
  if(a===null&&b===null)return 0;
  if(a===null)return 1;
  if(b===null)return -1;
  return descending?b-a:a-b;
}
function filter(){const q=$('q').value.toLowerCase().trim(),pet=$('pet').value,st=$('status').value,max=($('maxRent').value===''?Infinity:Number($('maxRent').value));filtered=rows.filter(r=>{const blob=[r[H.loc],r[H.portal],r[H.extras],r[H.desc],r[H.pet],r[H.status]].join(' ').toLowerCase();if(q&&!blob.includes(q))return false;if(num(r[H.rent])!=null&&num(r[H.rent])>max)return false;if(pet==='yes'&&r[H.pet]!=='Tak')return false;if(pet==='allowed'&&r[H.pet]==='Nie')return false;if(st!=='all'&&r[H.status]!==st)return false;return true});const s=$('sort').value,ts=v=>v?Date.parse(v):0;filtered.sort((a,b)=>s==='listing'?ts(b[H.listing])-ts(a[H.listing]):s==='rent'?compareNullable(a[H.rent],b[H.rent]):s==='total'?compareNullable(a[H.total],b[H.total]):s==='area'?compareNullable(a[H.area],b[H.area],true):ts(b[H.found])-ts(a[H.found]));render()}
function listingDescription(row){
  const description=row.description.replace(/\s+/g,' ').trim();
  let preview=description;
  if(description.length>180){
    const boundary=description.lastIndexOf(' ',180);
    preview=description.slice(0,boundary>0?boundary:180)+'…';
  }
  const rooms=row.rooms===null?'Brak danych':esc(row.rooms);
  return '<p class="description-preview">'+esc(preview)+'</p>'+
    '<details class="listing-details"><summary><span class="more">Pokaż szczegóły</span><span class="less">Zwiń szczegóły</span></summary>'+
    '<p>'+esc(description)+'</p><p><b>Pokoje:</b> '+rooms+'</p>'+
    '<p><b>Lokalizacja:</b> '+esc(row.location)+'</p>'+
    (row.fee_details!==''?'<p><b>Rozpoznane opłaty:</b> '+esc(row.fee_details)+'</p>':'')+
    '<p class="detail-note">Znany koszt razem to najem i rozpoznane opłaty. Dodatkowe koszty, np. parking i prąd, sprawdź w opisie. „—” oznacza brak danych.</p></details>';
}
function render(){const rents=filtered.map(r=>num(r[H.rent])).filter(v=>v!=null).sort((a,b)=>a-b),med=rents.length?(rents.length%2?rents[(rents.length-1)/2]:(rents[rents.length/2-1]+rents[rents.length/2])/2):null;$('sCount').textContent=filtered.length;$('sActive').textContent=filtered.filter(r=>r[H.activity]==='Aktywne').length;$('sPet').textContent=filtered.filter(r=>r[H.pet]==='Tak').length;$('sMedian').textContent=money(med);$('empty').style.display=filtered.length?'none':'block';
$('cards').innerHTML=filtered.map(r=>'<article class="card '+(['Nieaktualne','Archiwum'].includes(r[H.activity])?'off ':'')+(newListingIds.has(r.id)?'since-visit':'')+'">'+photoCard(r)+'<div class="top"><div class="badges">'+(newListingIds.has(r.id)?'<span class="badge new">Nowe od ostatniej wizyty</span>':'')+'<span class="badge">'+esc(r[H.portal])+'</span><span class="badge '+statusClass(r[H.status])+'">'+esc(r[H.status])+'</span></div><div class="title"><div><div class="loc">'+esc(r[H.loc])+'</div><div class="date">Znalezione '+date(r[H.found])+(r[H.listing]?' • ogłoszenie '+date(r[H.listing]):'')+'</div></div><div class="rent"><b>'+money(r[H.rent])+'</b><small>najem / mies.</small></div></div></div><div class="metrics"><div class="metric"><b>'+area(r[H.area])+'</b><span>metraż</span></div><div class="metric"><b>'+money(r[H.fees])+'</b><span>znane opłaty</span></div><div class="metric"><b>'+money(r[H.total])+'</b><span>znany koszt razem</span></div></div><div class="body">'+listingDescription(r)+(r[H.extras]?'<div class="extra"><b>Atuty:</b> '+esc(r[H.extras])+'</div>':'')+'<div class="row"><span>Kot / zwierzęta</span><span class="badge '+petClass(r[H.pet])+'">'+esc(r[H.pet])+'</span></div></div><div class="foot"><a class="btn" target="_blank" rel="noopener" href="'+esc(r[H.link])+'">Otwórz ogłoszenie</a></div><details class="edit"><summary>Status i własne uwagi</summary><div class="editin"><select class="ctl e-status" data-key="'+esc(key(r))+'">'+['Ciekawe','Do sprawdzenia','Obejrzane','Odrzucone','Nieaktualne'].map(x=>'<option '+(r[H.status]===x?'selected':'')+'>'+x+'</option>').join('')+'</select><textarea class="ctl e-note" data-key="'+esc(key(r))+'" placeholder="np. zadzwonić, obejrzane, za daleko…">'+esc(r[H.notes])+'</textarea></div></details></article>').join('');
document.querySelectorAll('.e-status').forEach(x=>x.onchange=()=>{const r=rows.find(r=>key(r)===x.dataset.key);if(r){save(r,{status:x.value},x)}});document.querySelectorAll('.e-note').forEach(x=>x.onchange=()=>{const r=rows.find(r=>key(r)===x.dataset.key);if(r){save(r,{notes:x.value},x)}})}
['q','pet','status','maxRent','sort'].forEach(id=>$(id).addEventListener(id==='q'||id==='maxRent'?'input':'change',filter));
function loadPreviousVisit(){
  const saved=localStorage.getItem('chata-visited-listings');
  if(saved===null)return;
  const ids=JSON.parse(saved);
  if(!Array.isArray(ids)||ids.some(id=>typeof id!=='string'))throw Error('Nieprawidłowy zapis wizyty');
  const previousIds=new Set(ids);
  newListingIds=new Set(rows.filter(row=>!previousIds.has(row.id)).map(row=>row.id));
}
function rememberVisit(){
  try{
    localStorage.setItem('chata-visited-listings',JSON.stringify(rows.map(row=>row.id)));
  }catch(error){
    $('visitError').textContent='Nie można zapisać wizyty w tej przeglądarce. Oznaczanie nowych ofert przy kolejnej wizycie może być nieaktualne.';
  }
}
async function loadListings(){
  try{
    const response=await fetch('/api/listings',{cache:'no-store'});
    if(!response.ok)throw Error('Błąd serwera ('+response.status+')');
    const data=await response.json();
    rows=Object.values(data.listings);
    galleries=data.galleries;
    let visitLoaded=false;
    try{
      loadPreviousVisit();
      visitLoaded=true;
    }catch(error){
      $('visitError').textContent='Nie można odczytać poprzedniej wizyty w tej przeglądarce. Nowe oferty nie zostały oznaczone.';
    }
    filter();
    if(visitLoaded)rememberVisit();
    const lastRun=data.last_run===null?'jeszcze nie wykonano':new Date(data.last_run).toLocaleString('pl-PL');
    $('source').textContent=rows.length+' ofert • '+Object.keys(galleries).length+' galerii • ostatni przebieg '+lastRun;
  }catch(error){
    $('source').textContent='Nie udało się wczytać ofert: '+error.message;
  }
}
loadListings();
</script>
</body></html>
